services:
  - type: web
    name: dm-seo-blog
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      # Security & SEO Trust Headers
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # Long-term Caching for Static Images & Media Assets
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Freshness Caching for HTML
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
